[package]
name = "graph-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Localhost viewer: serves an EntityGraph (raw and coalesced) to a React Flow page. Installed as `cerebro-http` by ./install.sh."

[[bin]]
name = "cerebro-http"
path = "src/main.rs"

[features]
default = ["treesitter"]
treesitter = ["dep:treesitter-producer"]
scip = ["dep:scip-producer"]

[dependencies]
entity-graph = { workspace = true }
coalesce = { workspace = true }
graph-diff = { workspace = true }
treesitter-producer = { workspace = true, optional = true }
scip-producer = { workspace = true, optional = true }
anyhow = { workspace = true }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tempfile = { workspace = true }
notify = { workspace = true }

[dev-dependencies]
entity-graph = { workspace = true, features = ["test-support"] }
# The diff-mode tests build both sides from real trees, so the producer must
# be there whatever the feature set the binary is built with.
treesitter-producer = { workspace = true }
