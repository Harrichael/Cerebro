[workspace]
resolver = "2"
members = ["crates/*"]
# SCIP test fixtures are standalone projects indexed by external tools; they
# must never be pulled into this workspace's build.
exclude = ["crates/scip-producer/tests/fixtures"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
entity-graph = { path = "crates/entity-graph" }
treesitter-producer = { path = "crates/treesitter-producer" }
scip-producer = { path = "crates/scip-producer" }
coalesce = { path = "crates/coalesce" }
nvim-ui = { path = "crates/nvim-ui" }
graph-diff = { path = "crates/graph-diff" }
tempfile = "3"
notify = "8"
rayon = "1"
